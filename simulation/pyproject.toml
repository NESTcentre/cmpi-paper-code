[project]
name = "cmpi-simulation"
version = "0.1.0"
description = "Clustering-sensitivity simulation for the CMPI paper (Supplementary)."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "nltk>=3.9.0",
    "leidenalg>=0.11.0",
    "igraph>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmpi_simulation"]
